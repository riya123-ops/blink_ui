[package]
name = "blink-desktop"
version = "1.0.0"
description = "Blink desktop app for Windows and macOS"
authors = ["TalentServ"]
edition = "2021"

[lib]
name = "blink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
